name: Trigger Cloudflare Pages rebuild

on:
  workflow_dispatch:

jobs:
  trigger-deploy-hook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages deploy hook
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "Missing secret CLOUDFLARE_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl -sS -X POST "$HOOK_URL"
